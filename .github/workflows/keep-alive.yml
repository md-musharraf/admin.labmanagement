name: Supabase Daily Keep-Alive

on:
  schedule:
    # Runs at 00:00 UTC every day (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        # A real table query: /rest/v1/ root (401 for anon) and /auth/v1/health don't count as activity.
        run: |
          SUPABASE_URL="https://lcjuaimfowitnollrath.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjanVhaW1mb3dpdG5vbGxyYXRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTA4MTIsImV4cCI6MjA5NTg2NjgxMn0.H6pdLGHUMrQD7RdKW7uiFByAXi1i6L2opCAeDnrrE-8"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 10 -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/customers?select=id&limit=1"

      - name: Wake Vercel keep-alive route
        run: curl -fsS --retry 3 --retry-all-errors --retry-delay 10 https://adminlabmanagement.vercel.app/api/keep-alive

      - name: Stop GitHub disabling this workflow after 60 days without commits
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
